
trigger:
  - main

pool:
  name: Default

stages:

  # ==========================================
  # STAGE 1: BUILD
  # ==========================================
  - stage: Build
    displayName: "Build - Prepare application"

    jobs:
      - job: BuildJob
        displayName: "Install dependencies and generate test data"

        steps:

          # Install Node.js
          - task: UseNode@1
            inputs:
              version: "24.x"
            displayName: "Install Node.js"

          # Install dependencies
          - script: npm ci
            displayName: "Install project dependencies"

          # Generate Faker data
          - script: npm run data:generate
            displayName: "Generate Faker test data"

          # Publish generated data
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "$(Build.SourcesDirectory)/datos/db.json"
              artifact: "test-data"
            displayName: "Publish generated test data"


  # ==========================================
  # STAGE 2: SMOKE TESTS
  # ==========================================
  - stage: SmokeTests
    displayName: "Smoke Tests - Validate application"

    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: SmokeTestsJob
        displayName: "Execute automated smoke tests"

        steps:

          # Install Node.js
          - task: UseNode@1
            inputs:
              version: "24.x"
            displayName: "Install Node.js"

          # Download generated data
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: "test-data"
              path: "$(Build.SourcesDirectory)/datos"
            displayName: "Download generated test data"

          # Install dependencies
          - script: npm ci
            displayName: "Install project dependencies"

          # Execute tests and generate normalized JUnit report
          - task: PowerShell@2
            displayName: "Run smoke tests and generate JUnit report"
            inputs:
              targetType: inline
              workingDirectory: "$(Build.SourcesDirectory)"
              script: |
                New-Item -ItemType Directory -Force reports | Out-Null

                npm run test:junit

                $reportPath = "reports/junit.xml"

                if (!(Test-Path $reportPath)) {
                  throw "JUnit report was not generated."
                }

                [xml]$report = Get-Content $reportPath -Raw

                $testCases = @($report.testsuites.testcase)

                if ($testCases.Count -eq 0) {
                  throw "No test cases were found in the JUnit report."
                }

                $testSuite = $report.CreateElement("testsuite")
                $testSuite.SetAttribute("name", "QA Cloud Native Smoke Tests")
                $testSuite.SetAttribute("tests", "$($testCases.Count)")

                $failures = @($testCases | Where-Object { $_.failure }).Count
                $errors = @($testCases | Where-Object { $_.error }).Count
                $skipped = @($testCases | Where-Object { $_.skipped }).Count

                $testSuite.SetAttribute("failures", "$failures")
                $testSuite.SetAttribute("errors", "$errors")
                $testSuite.SetAttribute("skipped", "$skipped")

                foreach ($testCase in $testCases) {
                  $null = $report.testsuites.RemoveChild($testCase)
                  $null = $testSuite.AppendChild($testCase)
                }

                $null = $report.testsuites.AppendChild($testSuite)
                $report.Save($reportPath)

                Write-Host "JUnit report normalized successfully."
                Write-Host "Test cases: $($testCases.Count)"
                Write-Host "Failures: $failures"
                Write-Host "Errors: $errors"
                Write-Host "Skipped: $skipped"

                Get-Content $reportPath -TotalCount 15

          # Diagnose JUnit report location
          - task: PowerShell@2
            displayName: "Diagnose JUnit report location"
            inputs:
              targetType: inline
              workingDirectory: "$(Build.SourcesDirectory)"
              script: |
                Write-Host "Sources directory:"
                Write-Host "$(Build.SourcesDirectory)"

                Write-Host "Current directory:"
                Get-Location

                Write-Host "Searching for JUnit XML files:"

                Get-ChildItem "$(Build.SourcesDirectory)" -Filter "*.xml" -Recurse |
                  Select-Object FullName, Length

          # Publish JUnit results
          - task: PublishTestResults@2
            displayName: "Publish smoke test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              searchFolder: "$(Build.SourcesDirectory)/reports"
              testResultsFiles: "junit.xml"
              mergeTestResults: true
              failTaskOnMissingResultsFile: true
              failTaskOnFailedTests: true
              testRunTitle: "QA Cloud Native - Smoke Tests"
