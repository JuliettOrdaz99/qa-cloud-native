
trigger:
  - main

pool:
  name: Default

stages:

  # ==========================================
  # STAGE 1: BUILD
  # ==========================================
  - stage: Build
    displayName: "Build - Prepare application"

    jobs:
      - job: BuildJob
        displayName: "Install dependencies and generate test data"

        steps:

          # Install Node.js
          - task: UseNode@1
            inputs:
              version: "24.x"
            displayName: "Install Node.js"

          # Install dependencies
          - script: npm ci
            displayName: "Install project dependencies"

          # Generate Faker data
          - script: npm run data:generate
            displayName: "Generate Faker test data"

          # Publish generated data
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "$(Build.SourcesDirectory)/datos/db.json"
              artifact: "test-data"
            displayName: "Publish generated test data"


  # ==========================================
  # STAGE 2: SMOKE TESTS
  # ==========================================
  - stage: SmokeTests
    displayName: "Smoke Tests - Validate application"

    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: SmokeTestsJob
        displayName: "Execute automated smoke tests"

        steps:

          # Install Node.js
          - task: UseNode@1
            inputs:
              version: "24.x"
            displayName: "Install Node.js"

          # Download generated data
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: "test-data"
              path: "$(Build.SourcesDirectory)/datos"
            displayName: "Download generated test data"

          # Install dependencies
          - script: npm ci
            displayName: "Install project dependencies"

          # Execute tests and generate JUnit
          - task: PowerShell@2
            displayName: "Run smoke tests and generate JUnit report"
            inputs:
              targetType: inline
              workingDirectory: "$(Build.SourcesDirectory)"
              script: |
                New-Item -ItemType Directory -Force reports | Out-Null

                npm run test:junit

                if (!(Test-Path "reports/junit.xml")) {
                  throw "JUnit report was not generated."
                }

                Write-Host "JUnit report generated successfully."

                Get-Content reports/junit.xml -TotalCount 10

          # Publish JUnit results
          - task: PublishTestResults@2
            displayName: "Publish smoke test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              searchFolder: "$(Build.SourcesDirectory)/reports"
              testResultsFiles: "junit.xml"
              mergeTestResults: true
              failTaskOnMissingResultsFile: true
              failTaskOnFailedTests: true
              testRunTitle: "QA Cloud Native - Smoke Tests"
