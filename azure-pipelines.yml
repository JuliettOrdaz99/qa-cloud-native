
                  $ready = $false

                  for ($i = 0; $i -lt 30; $i++) {
                    try {
                      $health = Invoke-RestMethod `
                        -Uri "http://localhost:3000/health" `
                        -TimeoutSec 2

                      if ($health.status -eq "ok") {
                        $ready = $true
                        break
                      }
                    }
                    catch {
                      Start-Sleep -Seconds 1
                    }
                  }

                  if (-not $ready) {
                    throw "Application did not become ready."
                  }

                  $env:BASE_URL = "http://localhost:3000"

                  npm run test:browser

                  if ($LASTEXITCODE -ne 0) {
                    throw "Playwright browser tests failed."
                  }
                }
                finally {
                  if ($server -and -not $server.HasExited) {
                    Stop-Process -Id $server.Id -Force
                    Write-Host "Application process stopped."
                  }
                }

  # ==========================================
  # STAGE 6: SAUCE LABS CLOUD TESTS
  # ==========================================
  - stage: SauceCloudTests
    displayName: "Sauce Labs - Cloud Browser Tests"

    dependsOn: BrowserTests
    condition: and(succeeded(), eq(variables['SAUCE_ENABLED'], 'true'))

    jobs:
      - job: SauceCloudJob
        displayName: "Execute Playwright tests in Sauce Labs"

        steps:
          - task: UseNode@1
            inputs:
              version: "24.x"
            displayName: "Install Node.js"

          - script: npm ci
            displayName: "Install project dependencies"

          - script: npm run data:generate
            displayName: "Generate test data"

          - task: PowerShell@2
            displayName: "Start application and execute Sauce Labs tests"
            inputs:
              targetType: inline
              workingDirectory: "$(Build.SourcesDirectory)"
              script: |
                $server = $null

                try {
                  $server = Start-Process `
                    -FilePath "node" `
                    -ArgumentList "app-tienda/server.js" `
                    -WorkingDirectory "$(Build.SourcesDirectory)" `
                    -PassThru `
                    -WindowStyle Hidden

                  Write-Host "Application started. PID: $($server.Id)"

                  $ready = $false

                  for ($i = 0; $i -lt 30; $i++) {
                    try {
                      $health = Invoke-RestMethod `
                        -Uri "http://localhost:3000/health" `
                        -TimeoutSec 2

                      if ($health.status -eq "ok") {
                        $ready = $true
                        break
                      }
                    }
                    catch {
                      Start-Sleep -Seconds 1
                    }
                  }

                  if (-not $ready) {
                    throw "Application did not become ready."
                  }

                  Write-Host "Application is ready."

                  npx saucectl run

                  if ($LASTEXITCODE -ne 0) {
                    throw "Sauce Labs cloud tests failed."
                  }

                  Write-Host "Sauce Labs cloud tests completed successfully."
                }
                finally {
                  if ($server -and -not $server.HasExited) {
                    Stop-Process -Id $server.Id -Force
                    Write-Host "Application process stopped."
                  }
                }
            env:
              SAUCE_USERNAME: $(SAUCE_USERNAME)
              SAUCE_ACCESS_KEY: $(SAUCE_ACCESS_KEY)
              SAUCE_TUNNEL_NAME: $(SAUCE_TUNNEL_NAME)
