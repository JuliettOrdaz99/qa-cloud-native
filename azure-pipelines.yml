
trigger:
  - main

pool:
  name: Default

variables:
  - group: SauceLabs-Variables
  - name: SAUCE_ENABLED
    value: 'true'

stages:

  # ==========================================
  # STAGE 1: BUILD
  # ==========================================
  - stage: Build
    displayName: "Build - Prepare application"

    jobs:
      - job: BuildJob
        displayName: "Install dependencies and generate test data"

        steps:

          # Install Node.js
          - task: UseNode@1
            inputs:
              version: "24.x"
            displayName: "Install Node.js"

          # Install dependencies
          - script: npm ci
            displayName: "Install project dependencies"

          # Generate Faker data
          - script: npm run data:generate
            displayName: "Generate Faker test data"

          # Publish generated data
          - task: PublishPipelineArtifact@1
            inputs:
              targetPath: "$(Build.SourcesDirectory)/datos/db.json"
              artifact: "test-data"
            displayName: "Publish generated test data"


  # ==========================================
  # STAGE 2: SMOKE TESTS
  # ==========================================
  - stage: SmokeTests
    displayName: "Smoke Tests - Validate application"

    dependsOn: Build
    condition: succeeded()

    jobs:
      - job: SmokeTestsJob
        displayName: "Execute automated smoke tests"

        steps:

          # Install Node.js
          - task: UseNode@1
            inputs:
              version: "24.x"
            displayName: "Install Node.js"

          # Download generated data
          - task: DownloadPipelineArtifact@2
            inputs:
              artifact: "test-data"
              path: "$(Build.SourcesDirectory)/datos"
            displayName: "Download generated test data"

          # Install dependencies
          - script: npm ci
            displayName: "Install project dependencies"

          # Execute tests and generate normalized JUnit report
          - task: PowerShell@2
            displayName: "Run smoke tests and generate JUnit report"
            inputs:
              targetType: inline
              workingDirectory: "$(Build.SourcesDirectory)"
              script: |
                New-Item -ItemType Directory -Force reports | Out-Null

                npm run test:junit

                Write-Host "Exit code from JUnit: $LASTEXITCODE"

                if ($LASTEXITCODE -ne 0) {
                  throw "Smoke tests failed."
                }

                $reportPath = "reports/junit.xml"

                if (!(Test-Path $reportPath)) {
                  throw "JUnit report was not generated."
                }

                [xml]$report = Get-Content $reportPath -Raw

                $testCases = @($report.testsuites.testcase)

                if ($testCases.Count -eq 0) {
                  throw "No test cases were found in the JUnit report."
                }

                $testSuite = $report.CreateElement("testsuite")
                $testSuite.SetAttribute("name", "QA Cloud Native Smoke Tests")
                $testSuite.SetAttribute("tests", "$($testCases.Count)")

                $failures = @($testCases | Where-Object { $_.failure }).Count
                $errors = @($testCases | Where-Object { $_.error }).Count
                $skipped = @($testCases | Where-Object { $_.skipped }).Count

                $testSuite.SetAttribute("failures", "$failures")
                $testSuite.SetAttribute("errors", "$errors")
                $testSuite.SetAttribute("skipped", "$skipped")

                foreach ($testCase in $testCases) {
                  $null = $report.testsuites.RemoveChild($testCase)
                  $null = $testSuite.AppendChild($testCase)
                }

                $null = $report.testsuites.AppendChild($testSuite)
                $report.Save($reportPath)

                Write-Host "JUnit report normalized successfully."
                Write-Host "Test cases: $($testCases.Count)"
                Write-Host "Failures: $failures"
                Write-Host "Errors: $errors"
                Write-Host "Skipped: $skipped"

                Get-Content $reportPath -TotalCount 15

          # Diagnose JUnit report location
          - task: PowerShell@2
            displayName: "Diagnose JUnit report location"
            condition: succeededOrFailed()
            inputs:
              targetType: inline
              workingDirectory: "$(Build.SourcesDirectory)"
              script: |
                Write-Host "Sources directory:"
                Write-Host "$(Build.SourcesDirectory)"

                Write-Host "Current directory:"
                Get-Location

                Write-Host "Searching for JUnit XML files:"

                Get-ChildItem "$(Build.SourcesDirectory)" -Filter "*.xml" -Recurse |
                  Select-Object FullName, Length

          # Publish JUnit results
          - task: PublishTestResults@2
            displayName: "Publish smoke test results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              searchFolder: "$(Build.SourcesDirectory)/reports"
              testResultsFiles: "junit.xml"
              mergeTestResults: true
              failTaskOnMissingResultsFile: true
              failTaskOnFailedTests: true
              testRunTitle: "QA Cloud Native - Smoke Tests"


  # ==========================================
  # STAGE 3: BDD TESTS
  # ==========================================
  - stage: BDDTests
    displayName: "BDD Tests - Validate business scenarios"

    dependsOn: SmokeTests
    condition: succeeded()

    jobs:
      - job: BDDTestsJob
        displayName: "Execute BDD tests with pytest-bdd"

        steps:

          # Verify existing Python installation
          - task: PowerShell@2
            displayName: "Use existing Python"
            inputs:
              targetType: inline
              script: |
                & "C:\Python315\python.exe" --version

                if ($LASTEXITCODE -ne 0) {
                  throw "Python was not found at C:\Python315\python.exe"
                }

          # Install Python dependencies
          - task: PowerShell@2
            displayName: "Install BDD dependencies"
            inputs:
              targetType: inline
              workingDirectory: "$(Build.SourcesDirectory)"
              script: |
                & "C:\Python315\python.exe" -m pip install -r requirements.txt

                if ($LASTEXITCODE -ne 0) {
                  throw "Failed to install BDD dependencies."
                }

          # Start API and execute BDD tests
          - task: PowerShell@2
            displayName: "Run BDD scenarios"
            inputs:
              targetType: inline
              workingDirectory: "$(Build.SourcesDirectory)"
              script: |
                $server = $null

                try {
                  npm ci

                  if ($LASTEXITCODE -ne 0) {
                    throw "Failed to install Node.js dependencies."
                  }

                  npm run data:generate

                  if ($LASTEXITCODE -ne 0) {
                    throw "Failed to generate test data."
                  }

                  $server = Start-Process `
                    -FilePath "node" `
                    -ArgumentList "app-tienda/server.js" `
                    -WorkingDirectory "$(Build.SourcesDirectory)" `
                    -PassThru `
                    -WindowStyle Hidden

                  Write-Host "API process started. PID: $($server.Id)"

                  $ready = $false

                  for ($i = 0; $i -lt 30; $i++) {
                    try {
                      $health = Invoke-RestMethod `
                        -Uri "http://localhost:3000/health" `
                        -TimeoutSec 2

                      if ($health.status -eq "ok") {
                        $ready = $true
                        break
                      }
                    }
                    catch {
                      Start-Sleep -Seconds 1
                    }
                  }

                  if (-not $ready) {
                    throw "API health check did not become ready."
                  }

                  Write-Host "API is healthy. Starting BDD tests."

                  $env:BASE_URL = "http://localhost:3000"

                  & "C:\Python315\python.exe" -m pytest steps/test_productos.py -v

                  if ($LASTEXITCODE -ne 0) {
                    throw "BDD tests failed."
                  }

                  Write-Host "BDD tests completed successfully."
                }
                finally {
                  if ($server -and -not $server.HasExited) {
                    Stop-Process -Id $server.Id -Force
                    Write-Host "API process stopped."
                  }
                }


  # ==========================================
  # STAGE 4: LOAD TEST
  # ==========================================
  - stage: LoadTest
    displayName: "Load Test - Validate performance SLA"

    dependsOn: BDDTests
    condition: succeeded()

    jobs:
      - job: LoadTestJob
        displayName: "Execute load test"

        steps:

          # Install Node.js
          - task: UseNode@1
            inputs:
              version: "24.x"
            displayName: "Install Node.js"

          # Install dependencies
          - script: npm ci
            displayName: "Install project dependencies"

          # Generate test data for the API
          - script: npm run data:generate
            displayName: "Generate Faker test data"

          # Start API, wait for health, run load test, and stop API
          - task: PowerShell@2
            displayName: "Start API and execute load test"
            inputs:
              targetType: inline
              workingDirectory: "$(Build.SourcesDirectory)"
              script: |
                $server = $null

                try {
                  $server = Start-Process `
                    -FilePath "node" `
                    -ArgumentList "app-tienda/server.js" `
                    -WorkingDirectory "$(Build.SourcesDirectory)" `
                    -PassThru `
                    -WindowStyle Hidden

                  Write-Host "API process started. PID: $($server.Id)"

                  $ready = $false

                  for ($i = 0; $i -lt 30; $i++) {
                    try {
                      $health = Invoke-RestMethod `
                        -Uri "http://localhost:3000/health" `
                        -TimeoutSec 2

                      if ($health.status -eq "ok") {
                        $ready = $true
                        break
                      }
                    }
                    catch {
                      Start-Sleep -Seconds 1
                    }
                  }

                  if (-not $ready) {
                    throw "API health check did not become ready."
                  }

                  Write-Host "API is healthy. Starting load test."

                  $env:BASE_URL = "http://localhost:3000"

                  npm run test:load

                  if ($LASTEXITCODE -ne 0) {
                    throw "Load test failed. Check the performance SLA."
                  }
                }
                finally {
                  if ($server -and -not $server.HasExited) {
                    Stop-Process -Id $server.Id -Force
                    Write-Host "API process stopped."
                  }
                }
  # ==========================================
  # STAGE 5: BROWSER TESTS
  # ==========================================
  - stage: BrowserTests
    displayName: "Browser Tests - Playwright"

    dependsOn: LoadTest
    condition: succeeded()

    jobs:
      - job: PlaywrightJob
        displayName: "Execute browser tests"

        steps:
          - task: UseNode@1
            inputs:
              version: "24.x"
            displayName: "Install Node.js"

          - script: npm ci
            displayName: "Install project dependencies"

          - script: npx playwright install chromium
            displayName: "Install Playwright Chromium"

          - script: npm run data:generate
            displayName: "Generate test data"

          - task: PowerShell@2
            displayName: "Start application and execute Playwright"
            inputs:
              targetType: inline
              workingDirectory: "$(Build.SourcesDirectory)"
              script: |
                $server = $null

                try {
                  $server = Start-Process `
                    -FilePath "node" `
                    -ArgumentList "app-tienda/server.js" `
                    -WorkingDirectory "$(Build.SourcesDirectory)" `
                    -PassThru `
                    -WindowStyle Hidden

                  Write-Host "Application process started. PID: $($server.Id)"

                  $ready = $false

                  for ($i = 0; $i -lt 30; $i++) {
                    try {
                      $health = Invoke-RestMethod `
                        -Uri "http://localhost:3000/health" `
                        -TimeoutSec 2

                      if ($health.status -eq "ok") {
                        $ready = $true
                        break
                      }
                    }
                    catch {
                      Start-Sleep -Seconds 1
                    }
                  }

                  if (-not $ready) {
                    throw "Application did not become ready."
                  }

                  $env:BASE_URL = "http://localhost:3000"

                  npm run test:browser

                  if ($LASTEXITCODE -ne 0) {
                    throw "Playwright browser tests failed."
                  }
                }
                finally {
                  if ($server -and -not $server.HasExited) {
                    Stop-Process -Id $server.Id -Force
                    Write-Host "Application process stopped."
                  }
                }

  # ==========================================
  # STAGE 6: SAUCE LABS CLOUD TESTS
  # ==========================================
  - stage: SauceCloudTests
    displayName: "Sauce Labs - Cloud Browser Tests"

    dependsOn: BrowserTests
    condition: and(succeeded(), eq(variables['SAUCE_ENABLED'], 'true'))

    jobs:
      - job: SauceCloudJob
        displayName: "Execute Playwright tests in Sauce Labs"

        steps:
          - task: UseNode@1
            inputs:
              version: "24.x"
            displayName: "Install Node.js"

          - script: npm ci
            displayName: "Install project dependencies"

          - script: npm run data:generate
            displayName: "Generate test data"

          - task: PowerShell@2
            displayName: "Start application and execute Sauce Labs tests"
            inputs:
              targetType: inline
              workingDirectory: "$(Build.SourcesDirectory)"
              script: |
                $server = $null

                try {
                  $server = Start-Process `
                    -FilePath "node" `
                    -ArgumentList "app-tienda/server.js" `
                    -WorkingDirectory "$(Build.SourcesDirectory)" `
                    -PassThru `
                    -WindowStyle Hidden

                  Write-Host "Application started. PID: $($server.Id)"

                  $ready = $false

                  for ($i = 0; $i -lt 30; $i++) {
                    try {
                      $health = Invoke-RestMethod `
                        -Uri "http://localhost:3000/health" `
                        -TimeoutSec 2

                      if ($health.status -eq "ok") {
                        $ready = $true
                        break
                      }
                    }
                    catch {
                      Start-Sleep -Seconds 1
                    }
                  }

                  if (-not $ready) {
                    throw "Application did not become ready."
                  }

                  Write-Host "Application is ready."

                  npx saucectl run

                  if ($LASTEXITCODE -ne 0) {
                    throw "Sauce Labs cloud tests failed."
                  }

                  Write-Host "Sauce Labs cloud tests completed successfully."
                }
                finally {
                  if ($server -and -not $server.HasExited) {
                    Stop-Process -Id $server.Id -Force
                    Write-Host "Application process stopped."
                  }
                }
            env:
              SAUCE_USERNAME: $(SAUCE_USERNAME)
              SAUCE_ACCESS_KEY: $(SAUCE_ACCESS_KEY)
              SAUCE_TUNNEL_NAME: $(SAUCE_TUNNEL_NAME)
